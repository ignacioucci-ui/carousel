<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabajo Práctico - Bootstrap Carousel</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <header>
        <div id="miCarrusel" class="carousel slide" data-bs-ride="carousel">
            
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#miCarrusel" data-bs-slide-to="0" class="active"></button>
                <button type="button" data-bs-target="#miCarrusel" data-bs-slide-to="1"></button>
                <button type="button" data-bs-target="#miCarrusel" data-bs-slide-to="2"></button>
            </div>

            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="https://picsum.photos/id/1015/1200/400" class="d-block w-100" alt="Estadio">
                </div>
                <div class="carousel-item">
                    <img src="https://picsum.photos/id/1016/1200/400" class="d-block w-100" alt="Entrenamiento">
                </div>
                <div class="carousel-item">
                    <img src="https://picsum.photos/id/1018/1200/400" class="d-block w-100" alt="Táctica">
                </div>
            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#miCarrusel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Anterior</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#miCarrusel" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Siguiente</span>
            </button>
        </div>
    </header>

    <main class="container my-5">
        <h1 class="text-center mb-4">Paisajes</h1>
        <p class="lead text-center">Distintas fotos de paisajes.</p>
        <p>Acá voy a mostrar el carrusel de fotos de paisajes para la presentacion del TP2.</p>
    </main>

    <footer class="bg-dark text-white text-center py-4 mt-5">
        <div class="container">
            <p>imagnes recopiladas de google fotos.</p>
            <p>Contacto de la fuente: <a href="mailto:info@imagenes.com" class="text-info">info@analisis-tactico.com</a></p>
            <p class="mb-0 small">Alumno: Ignacio - 2026</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
